name: Purge jsDelivr cache

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      paths:
        description: "Space-separated file paths to purge (e.g. marketing-flyers/marketing-flyers.json)"
        required: true

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed files
        id: files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MANUAL_PATHS: ${{ github.event.inputs.paths }}
        run: |
          if [ -n "$MANUAL_PATHS" ]; then
            printf '%s\n' $MANUAL_PATHS > changed.txt
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > changed.txt
          else
            # Every commit in the push, not just the last one. Deleted files are skipped.
            git diff --name-only --diff-filter=AMR "$BEFORE" "$AFTER" > changed.txt
          fi
          grep -v '^\.github/' changed.txt > purge.txt || true
          echo "Files to purge:"; cat purge.txt

      - name: Purge
        run: |
          failed=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            path=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$f")
            url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$path"
            res=$(curl -s --max-time 30 "$url")
            echo "$f -> $res"
            echo "$res" | grep -q '"status": *"finished"' || failed=1
          done < purge.txt
          exit $failed
